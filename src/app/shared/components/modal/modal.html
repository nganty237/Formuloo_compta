@if (isOpen) {
<div class="fixed inset-0 z-50 flex items-center justify-center">

    <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="closed.emit()">
    </div>

    <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 z-10">

        <div class="flex justify-between items-center p-6 border-b border-gray-100">
            <h3 class="text-lg font-bold text-gray-900">{{ title }}</h3>
            <button (click)="closed.emit()"
                class="text-gray-400 hover:text-gray-600 transition-colors text-xl font-light">
                ✕
            </button>
        </div>

        <div class="p-6">
            <ng-content></ng-content>
        </div>

    </div>
</div>
}
