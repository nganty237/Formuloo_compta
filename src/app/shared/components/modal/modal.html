@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="closed.emit()"></div>

    <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-lg z-10 overflow-hidden transform transition-all">
      
      <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-slate-50">
        <h3 class="text-base font-bold text-slate-900">{{ title }}</h3>
        <button (click)="closed.emit()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md hover:bg-slate-200/50 transition-colors text-sm">
          ✕
        </button>
      </div>

      <div class="p-6 text-sm text-slate-600">
        <ng-content></ng-content>
      </div>

    </div>
  </div>
}
