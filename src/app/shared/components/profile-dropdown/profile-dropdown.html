<div class="absolute right-0 mt-2 w-56 rounded-md border border-gray-100 bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none z-50 origin-top-right animate-in fade-in slide-in-from-top-1 duration-100">
    <div class="px-4 py-3 border-b border-gray-100">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Compte connecté</p>
        <p class="text-sm font-medium text-gray-900 truncate mt-0.5">{{ username() }}</p>
        <p class="text-xs text-gray-500 truncate mt-0.5">{{ role() }}</p>
    </div>

    <div class="py-1">
        <a routerLink="settings" 
           (click)="closeMenu.emit()"
           class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-colors cursor-pointer group">
            <app-icon name="settings" size="sm" className="text-gray-400 group-hover:text-gray-600 transition-colors"></app-icon>
            <span>Paramètres du dossier</span>
        </a>
    </div>

    <div class="py-1 border-t border-gray-100">
        <app-button type="button" 
                (clicked)="onLogout()"
                customClass="w-full flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors cursor-pointer group text-left">
            <app-icon name="log-out" size="sm" className="text-red-400 group-hover:text-red-600 transition-colors"></app-icon>
            <span class="font-medium">Déconnexion</span>
        </app-button>
    </div>
</div>
