<aside class="h-full flex flex-col bg-slate-900 text-white relative border-r border-slate-800">

    <div
        class="p-4 font-bold tracking-wider text-blue-400 flex items-center justify-between border-b border-slate-800 h-16">

        @if (!isCollapsed) {
        <span class="text-xl transition-all duration-300">Formuloo Compta</span>
        } @else {
        <span class="text-xl mx-auto transition-all duration-300">FC</span>
        }
    </div>

    <nav class="flex-1 px-3 space-y-2 mt-4">
        <a [routerLink]="['/tenant', tenantId, 'dashboard']" routerLinkActive="bg-slate-800 text-white"
            class="flex items-center gap-3 px-3 py-2 rounded text-slate-300 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer no-underline">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 flex-shrink-0 text-blue-400" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z" />
            </svg>
            @if (!isCollapsed) {
            <span class="text-sm font-medium">Tableau de Bord</span>
            }
        </a>

        <a [routerLink]="['/tenant', tenantId, 'accounting']" routerLinkActive="bg-slate-800 text-white"
            class="flex items-center gap-3 px-3 py-2 rounded text-slate-300 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer no-underline">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 flex-shrink-0 text-blue-400" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            @if (!isCollapsed) {
            <span class="text-sm font-medium">Comptabilité</span>
            }
        </a>
    </nav>

    <div class="p-3 border-t border-slate-800 flex justify-center">
        <button (click)="onToggle()"
            class="w-full flex items-center justify-center p-2 rounded text-slate-400 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer"
            title="{{ isCollapsed ? 'Déplier la barre' : 'Replier la barre' }}">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform duration-300"
                [class.rotate-180]="isCollapsed" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
            </svg>
        </button>
    </div>
</aside>
