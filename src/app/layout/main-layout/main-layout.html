<div class="flex h-screen bg-gray-100 overflow-hidden">
    <app-sidebar
        [class]="isSidebarCollapsed ? 'w-16 flex-shrink-0 transition-all duration-300' : 'w-64 flex-shrink-0 transition-all duration-300'"
        [isCollapsed]="isSidebarCollapsed" (toggleCollapse)="toggleSidebar()">
    </app-sidebar>

    <div class="flex-1 flex flex-col overflow-hidden">
        <app-header></app-header>

        <main class="flex-1 overflow-y-auto p-6">
            <router-outlet></router-outlet>
        </main>

        <app-footer></app-footer>
    </div>
</div>
