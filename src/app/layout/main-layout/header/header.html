<header class="w-full flex justify-between items-center bg-white border-b border-gray-200 h-16 px-6">
    
    <div class="flex items-center gap-4">
        <div class="flex items-center gap-3">
            <label for="company-select" class="text-sm font-medium text-gray-500">Dossier :</label>
            <div class="relative">
                <select id="company-select" #companySelect (change)="onCompanyChange(companySelect.value)"
                    class="block w-48 pl-3 pr-10 py-1.5 text-sm text-gray-900 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-500 focus:border-slate-500 appearance-none bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors">
                    @for (company of companies; track company.id) {
                    <option [value]="company.id" [selected]="company.id === selectedCompanyId">
                        {{ company.name }}
                    </option>
                    }
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="hidden sm:block h-5 w-px bg-gray-300 mx-2"></div>

        @if (companyName$ | async; as cName) {
        <div class="hidden sm:flex items-center gap-2">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
            </span>
            <span class="text-sm font-medium text-slate-700">
                {{ cName }}
            </span>
        </div>
        }
    </div>

    <div class="flex items-center gap-4">
        <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors focus:outline-none rounded-full p-1 hover:bg-gray-100">
            <span class="sr-only">Voir les notifications</span>
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
        </button>

        <div class="h-5 w-px bg-gray-300"></div>

        <div class="h-5 w-px bg-gray-300"></div>

    <div class="relative">
        <button (click)="toggleProfileMenu($event)"
            class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-1.5 rounded-md transition-colors text-left focus:outline-none">
            <div class="h-8 w-8 rounded-full bg-slate-800 text-white flex items-center justify-center font-medium text-sm shadow-sm">
                AN
            </div>
            <div class="hidden md:block">
                <p class="text-sm font-medium text-gray-700 leading-none">Anicet Nganty</p>
                <p class="text-xs text-gray-400 mt-0.5 leading-none">Comptable Principal</p>
            </div>
            <svg class="h-4 w-4 text-gray-400 transition-transform duration-200" 
                [class.rotate-180]="isProfileMenuOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>

        @if (isProfileMenuOpen()) {
            <app-profile-dropdown 
                [username]="'Anicet Nganty'"
                [role]="'Comptable Principal'"
                (closeMenu)="isProfileMenuOpen.set(false)"
                (logout)="handleLogout()">
            </app-profile-dropdown>
        }
    </div>
    </div>
</header>
