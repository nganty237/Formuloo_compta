<header class="w-full flex justify-between items-center bg-white shadow-sm h-16 px-6">
    <div class="flex items-center gap-6">
        <!-- Sélecteur d'Entreprise (nouveau pour tester TenantContextService) -->
        <div class="flex items-center gap-3">
            <label for="company-select" class="text-sm font-semibold text-blue-600 uppercase tracking-wider">Dossier Actif :</label>
            <select id="company-select" #companySelect (change)="onCompanyChange(companySelect.value)"
                class="bg-blue-50 border border-blue-200 text-blue-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 font-medium cursor-pointer outline-none">
                @for (company of companies; track company.id) {
                <option [value]="company.id" [selected]="company.id === selectedCompanyId">
                    {{ company.name }}
                </option>
                }
            </select>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <!-- Affichage dynamique du nom de l'entreprise via RxJS et pipe async -->
        @if (companyName$ | async; as cName) {
        <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-bold mr-4 transition-all">
            Traitement: {{ cName }}
        </span>
        }

        <span class="text-sm text-gray-500">Anicet Nganty</span> 
        <a routerLink="/login"
            class="px-4 py-2 bg-red-50 text-red-600 rounded hover:bg-red-100 text-sm font-medium transition-colors cursor-pointer no-underline">
            Déconnexion
        </a>
    </div>
</header>
