<header class="w-full flex justify-between items-center bg-white border-b border-gray-200 h-16 px-6">

    <div class="flex items-center gap-4">
        <!-- Sélection du dossier (Multi-tenant) -->
        <div *appHasRole="['ADMIN', 'COMPTABLE', 'SUPER_ADMIN']" class="flex items-center gap-3">
            <label for="company-select" class="text-sm font-medium text-gray-500 font-semibold">Dossier :</label>
            <div class="relative">
                <select id="company-select" #companySelect (change)="onCompanyChange(companySelect.value)"
                    class="block w-48 pl-3 pr-10 py-1.5 text-sm text-gray-900 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-slate-500 focus:border-slate-500 appearance-none bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors font-medium">
                    @for (company of filteredCompanies(); track company.id) {
                    <option [value]="company.id" [selected]="company.id === selectedCompanyId">
                        {{ company.nom }}
                    </option>
                    }
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                    <app-icon name="chevron-down" size="sm"></app-icon>
                </div>
            </div>
        </div>

        @if (companyName$ | async; as cName) {
        <div class="hidden lg:flex items-center gap-2 ml-4">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
            </span>
            <span class="text-sm font-semibold text-slate-700">
                {{ cName }}
            </span>
        </div>
        }
    </div>

    <div class="flex items-center gap-4">
        <!-- Lien vers la liste des entreprises du cabinet -->
        <a *appHasRole="['ADMIN', 'COMPTABLE', 'SUPER_ADMIN']" routerLink="companies" class="inline-flex items-center gap-1.5 text-slate-600 hover:text-blue-600 transition-colors text-sm font-semibold mr-2 cursor-pointer">
            <app-icon name="settings" size="sm"></app-icon>
            Dossiers Clients
        </a>

        <app-button type="button" customClass="text-gray-400 hover:text-gray-600 transition-colors focus:outline-none rounded-full p-1 hover:bg-gray-100" ariaLabel="Voir les notifications">
            <span class="sr-only">Voir les notifications</span>
            <app-icon name="bell"></app-icon>
        </app-button>

        <div class="relative">
            <app-button (clicked)="toggleProfileMenu($event)"
                customClass="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-1.5 rounded-md transition-colors text-left focus:outline-none">
                <div class="h-8 w-8 rounded-full bg-slate-800 text-white flex items-center justify-center font-medium text-sm shadow-sm">
                    {{ currentUser()?.name?.substring(0, 2)?.toUpperCase() }}
                </div>
                <div class="hidden md:block">
                    <p class="text-sm font-semibold text-gray-700 leading-none">{{ currentUser()?.name }}</p>
                    <p class="text-xs text-gray-400 mt-1 leading-none">{{ currentUser()?.role }}</p>
                </div>
                <app-icon
                    name="chevron-down"
                    size="sm"
                    [className]="'text-gray-400 transition-transform duration-200 ' + (isProfileMenuOpen() ? 'rotate-180' : '')"></app-icon>
            </app-button>

            @if (isProfileMenuOpen()) {
                <app-profile-dropdown
                    [username]="currentUser()?.name ?? 'Utilisateur'"
                    [role]="currentUser()?.role ?? 'Role'"
                    (closeMenu)="isProfileMenuOpen.set(false)"
                    (logout)="handleLogout()">
                </app-profile-dropdown>
            }
        </div>
    </div>
</header>
